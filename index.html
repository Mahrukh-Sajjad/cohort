<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width= , initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <!-- h1 to h6 -->
    <h1>Heading</h1>
    <h2>Heading</h2>
    <h3>Heading</h3>
    <h4>Heading</h4>
    <h5>Heading</h5>
    <h6>Heading</h6>

    <!-- Paragraph tag -->
    <p>This is a paragraph</p>

    <a href="">This is anchor tag</a>

    <!-- Nested list -->
    <ul>
      <li>Item 1</li>
      <li>Item 2</li>
      <ol>
        <li>Sub item 1</li>
        <li>Sub item 2</li>
      </ol>
    </ul>

    <a href="https://example.com" target="_blank">visit example</a>

    <!-- Jumpiung between different sections -->
    <a href="#new">link to new content</a>
    <h1 id="new">New content</h1>

    <!-- Html forms and inputs -->
    <form>
      <label for="name">Name</label>
      <input type="text" id="name" name="name" required />
      <button type="submit">Submit</button>
    </form>
  </body>
</html>
